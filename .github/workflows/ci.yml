name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck

  release:
    name: Release checks (Chromium and Firefox, real fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install browsers
        run: pnpm --filter @autumntrace/consent-lab exec playwright install --with-deps chromium firefox

      - name: Clean shop, both browsers (must exit 0)
        run: pnpm demo --out reports/ci-clean

      - name: Each defect must fail and exit 1
        run: |
          for defect in early-pageview cookie-after-revoke reinit-on-navigation; do
            set +e
            pnpm demo --defect "$defect" --out "reports/ci-$defect"
            code=$?
            set -e
            echo "$defect exited $code"
            test "$code" -eq 1
          done

      - name: Release test suite
        run: pnpm test:release

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consent-lab-reports
          path: reports/ci-*
